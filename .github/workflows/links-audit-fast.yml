name: Verify all portfolio external URLs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/links-audit-fast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/links-audit-fast.mjs

name: Build and validate portfolio
on:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Delayed push webhooks from older commits must not cancel a newer verified build.
  group: portfolio-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify-and-sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:geometry
      - name: Restore Vite HTML entrypoint
        run: cp site/index.source.html index.html
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/prototype-3d-smoke.mjs
      - name: Publish compiled files to branch root
        if: github.ref == 'refs/heads/main'
        run: bash scripts/sync-published-root.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-screenshots
          path: test-output/
          if-no-files-found: ignore

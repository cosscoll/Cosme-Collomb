name: Capture real portfolio project evidence
on:
  push:
    branches: [fix/portfolio-evidence-20261013]
permissions:
  contents: read
jobs:
  capture-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/capture-project-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-project-evidence
          path: test-output/project-evidence/

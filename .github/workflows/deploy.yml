name: Verify stronger Chrome Cobalt contrasts and mobile layouts
on:
  push:
    branches: [fix/cobalt-contrast]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-contrast-and-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check computed contrasts, all pages and real WebGL composition
        env:
          RESPONSIVE_CAPTURE: '1'
        run: node tests/responsive-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrast-and-responsive-evidence
          path: test-output/

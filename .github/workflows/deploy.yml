name: Verify restored original portfolio in the public browser
on:
  push:
    branches: [fix/restore-before-charter-public]
permissions:
  contents: read
jobs:
  verify-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE: https://cosscoll.github.io/Cosme-Collomb/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check the exact restored public release
        run: node tests/public-http-check.mjs
      - name: Check public 3D journey, header navigation and eight homepage projects
        env:
          AUDIT_QUICK: '1'
        run: node tests/network-browser.mjs
      - name: Capture the original identity on desktop, phone and tablet
        run: node tests/rollback-visual-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-original-public-evidence
          path: test-output/
          if-no-files-found: ignore

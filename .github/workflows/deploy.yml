name: Build and validate portfolio
on:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Serialize writes for a branch; don't let a newer build cancel validation.
  group: portfolio-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-sync:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:geometry
      - run: node --test tests/prototype-v2-geometry.test.mjs
      - name: Restore Vite HTML entrypoint
        run: cp site/index.source.html index.html
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        if: github.ref != 'refs/heads/dev/v3-five-loop-quality'
      - run: node tests/prototype-3d-smoke.mjs
        if: github.ref != 'refs/heads/dev/v3-five-loop-quality'
      - name: Audit five opaque V3 3D project loops (isolated prototype only)
        if: startsWith(github.ref, 'refs/heads/dev/v3-five-loop-quality')
        run: node tests/prototype-v3-browser.mjs
      - name: Check all five seamless 3D project loops (dedicated full audit)
        if: github.event_name == 'workflow_dispatch'
        run: node tests/prototype-v2-browser.mjs
      - name: Publish compiled files to branch root
        if: github.ref == 'refs/heads/main'
        run: bash scripts/sync-published-root.sh
      - name: Verify public Pages serves this exact compiled release
        if: github.ref == 'refs/heads/main'
        env:
          PUBLIC_SITE: https://cosscoll.github.io/Cosme-Collomb/
        run: node tests/public-http-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-screenshots
          path: test-output/
          if-no-files-found: ignore

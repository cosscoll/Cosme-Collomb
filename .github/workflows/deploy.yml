name: Verify published Chrome Cobalt on phones and tablets
on:
  push:
    branches: [fix/cobalt-public-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build the exact published source for comparison
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the exact public release and its assets
        env:
          PUBLIC_SITE: https://cosscoll.github.io/Cosme-Collomb/
        run: node tests/public-http-check.mjs
      - name: Verify real public 3D travel, header navigation and eight home projects
        env:
          PUBLIC_SITE: https://cosscoll.github.io/Cosme-Collomb/
          AUDIT_QUICK: '1'
        run: node tests/network-browser.mjs
      - name: Verify all public pages and mobile orientation changes
        env:
          PUBLIC_SITE: https://cosscoll.github.io/Cosme-Collomb/
          RESPONSIVE_CAPTURE: '1'
        run: node tests/responsive-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-chrome-cobalt-evidence
          path: test-output/

name: Chrome Cobalt responsive layout audit
on:
  push:
    branches: [fix/cobalt-responsive]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Restore source HTML
        run: cp site/index.source.html index.html
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check corrected source layout in eight device formats
        env:
          RESPONSIVE_CAPTURE: '1'
        run: node tests/responsive-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-layout-evidence
          path: test-output/

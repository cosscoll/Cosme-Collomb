name: Chrome Cobalt responsive layout audit
on:
  push:
    branches: [fix/cobalt-responsive]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check current public layout in eight device formats
        env:
          PUBLIC_SITE: https://cosscoll.github.io/Cosme-Collomb/
          RESPONSIVE_CAPTURE: '1'
        run: node tests/responsive-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-layout-evidence
          path: test-output/

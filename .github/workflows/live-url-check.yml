name: Independent live website URL check
on:
  push:
    branches: ['dev/check-public-site-url']
permissions:
  contents: read
jobs:
  public-http:
    runs-on: ubuntu-latest
    steps:
      - name: Verify new 3D bridge demo is live, bundled and accessible
        shell: bash
        run: |
          set -euo pipefail
          base='https://cosscoll.github.io/Cosme-Collomb/'
          curl --max-time 30 -fsSL -w 'Portfolio HTTP %{http_code} / %{url_effective}\n' -o /tmp/portfolio.html "$base"
          grep -q 'Cosme Collomb' /tmp/portfolio.html
          demo="${base}prototype-3d/"
          curl --max-time 30 -fsSL -w '3D DEMO HTTP %{http_code} / %{url_effective}\n' -o /tmp/demo.html "$demo"
          grep -q 'Un seul chemin' /tmp/demo.html
          grep -q '/Cosme-Collomb/assets/prototype3d-3fiVhCvC.js' /tmp/demo.html
          for asset in prototype3d-3fiVhCvC.js three.module-B9sLsWfD.js prototype3d-DRIvYSmP.css; do
            curl --max-time 30 -fsSL -w "Asset $asset HTTP %{http_code}\n" -o /tmp/verified-asset "https://cosscoll.github.io/Cosme-Collomb/assets/$asset"
            test -s /tmp/verified-asset
          done
          echo "LIVE PROTOTYPE VERIFIED: $demo"

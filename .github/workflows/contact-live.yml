name: Final published portfolio email delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/contact-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-contact-on-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Verify live published CodeFreeForm and email sent
        run: node tests/contact-live-check.mjs

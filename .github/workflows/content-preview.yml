name: Project content preview
on:
  push:
    branches: ['review/portfolio-content-*']
permissions:
  contents: read
jobs:
  verify-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: cp site/index.source.html index.html
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/portfolio-content.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-content-preview
          path: test-output/
